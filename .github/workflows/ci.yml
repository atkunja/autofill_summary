name: Extension checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ats-fixture-evidence
          path: test-results/ats-fixtures.json
          if-no-files-found: ignore
      - name: Package unpacked extension
        run: cd extension && zip -r ../apply-personally.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: apply-personally
          path: apply-personally.zip
